name: Lunaris CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    services:
      sqlite:
        image: nouchka/sqlite3:latest
        options: --entrypoint "sh"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (placeholder)
        run: echo "Sin linter configurado aun - agregar 'npm run lint' cuando este listo"

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Verify server starts
        run: |
          timeout 5 node server/index.js 2>&1 || true
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npx vitest run --coverage
        continue-on-error: true
